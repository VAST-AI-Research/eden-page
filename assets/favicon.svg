<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Eden">
  <!-- favicon 是 assets/logo.svg 的 16px 专用版：同一个图形（缺口环 + 圆心点 +
       射向缺口的箭头），但笔画更粗、箭尖更短。
       16px 下 logo 那版的箭尖两笔会和环黏在一起糊成一坨，缩短箭尖、加粗主笔
       之后三个元素才分得开（这是按 16px 实际渲染挑出来的，别凭感觉改）。
       改 logo 记得同步改这里。
       注意：SVG 是 XML，注释里不能出现连续两个减号。 -->
  <g fill="none" stroke="#5b4bdb" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52.5 34.5 A 23 23 0 1 1 29.5 11.5"/>
    <path d="M29.5 34.5 L 55 9"/>
    <path d="M46 9 H 55 V 18"/>
  </g>
  <circle cx="29.5" cy="34.5" r="8.5" fill="#5b4bdb"/>
</svg>
