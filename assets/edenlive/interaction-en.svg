<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="388" viewBox="0 0 1180 388" font-family="'Google Sans Flex','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.4 8.4 5 1 8.6z" fill="#5b4bdb"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1.4 8.4 5 1 8.6z" fill="#99a0b6"/>
    </marker>
  </defs>

  <!-- ===================== code agent, above the engine ===================== -->
  <g>
    <rect x="266" y="8" width="188" height="66" rx="11" fill="#ffffff" stroke="#c4c9d8" stroke-dasharray="5 4"/>
    <text x="360" y="47" font-size="15.5" font-weight="500" fill="#0b0d13" text-anchor="middle">Code Agent</text>
  </g>
  <!-- 三条虚线指向引擎，中间标注交付物 -->
  <g fill="none" stroke="#99a0b6" stroke-width="1.5" stroke-dasharray="3 3">
    <path d="M324 80 V168" marker-end="url(#arrow-muted)"/>
    <path d="M360 80 V168" marker-end="url(#arrow-muted)"/>
    <path d="M396 80 V168" marker-end="url(#arrow-muted)"/>
  </g>
  <rect x="310" y="106" width="100" height="24" fill="#ffffff"/>
  <text x="360" y="122" font-size="11.5" font-weight="600" fill="#6b7391" text-anchor="middle" letter-spacing=".6">ENGINE CODE</text>

  <!-- ===================== 1. user input ===================== -->
  <g>
    <rect x="36" y="168" width="188" height="128" rx="13" fill="#f7f8fc" stroke="#e4e7f0"/>
    <text x="130" y="222" font-size="13" font-weight="600" fill="#0b0d13" text-anchor="middle" letter-spacing=".5">USER INPUT</text>
    <text x="130" y="246" font-size="13" fill="#6b7391" text-anchor="middle">keyboard &amp; mouse</text>
  </g>

  <!-- ===================== 2. engine ===================== -->
  <g>
    <rect x="266" y="168" width="188" height="128" rx="13" fill="#f7f8fc" stroke="#e4e7f0"/>
    <text x="360" y="214" font-size="13" font-weight="600" fill="#0b0d13" text-anchor="middle" letter-spacing=".5">ENGINE</text>
    <text x="360" y="238" font-size="12.5" fill="#6b7391" text-anchor="middle">updates state, emits</text>
    <text x="360" y="256" font-size="12.5" fill="#6b7391" text-anchor="middle">simplified frames</text>
  </g>

  <!-- ===================== 3. proxy frame stream ===================== -->
  <g>
    <rect x="496" y="168" width="188" height="128" rx="13" fill="#ffffff" stroke="#5b4bdb" stroke-width="1.5"/>
    <text x="590" y="214" font-size="12.5" font-weight="600" fill="#5b4bdb" text-anchor="middle">PROXY FRAME</text>
    <text x="590" y="232" font-size="12.5" font-weight="600" fill="#5b4bdb" text-anchor="middle">STREAM</text>
    <text x="590" y="256" font-size="12.5" fill="#6b7391" text-anchor="middle">layout, camera, motion</text>
  </g>

  <!-- ===================== 4. EdenLive ===================== -->
  <g>
    <rect x="726" y="168" width="188" height="128" rx="15" fill="#5b4bdb"/>
    <text x="820" y="224" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">EdenLive</text>
    <text x="820" y="248" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle" opacity=".9">Real-time rendering</text>
  </g>

  <!-- ===================== 5. frames shown ===================== -->
  <g>
    <rect x="956" y="168" width="188" height="128" rx="13" fill="#ffffff" stroke="#0fb5a6" stroke-width="1.5"/>
    <text x="1050" y="222" font-size="13" font-weight="600" fill="#0fb5a6" text-anchor="middle" letter-spacing=".4">FRAMES SHOWN</text>
    <text x="1050" y="246" font-size="12.5" fill="#6b7391" text-anchor="middle">watches, then acts</text>
  </g>

  <!-- ===================== forward arrows ===================== -->
  <g fill="none" stroke="#5b4bdb" stroke-width="1.5">
    <line x1="224" y1="232" x2="266" y2="232" marker-end="url(#arrow)"/>
    <line x1="454" y1="232" x2="496" y2="232" marker-end="url(#arrow)"/>
    <line x1="684" y1="232" x2="726" y2="232" marker-end="url(#arrow)"/>
    <line x1="914" y1="232" x2="956" y2="232" marker-end="url(#arrow)"/>
  </g>

  <!-- 看过画面再操作，折回用户输入 -->
  <path d="M1050 296 V352 H130 V296" fill="none" stroke="#99a0b6" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
</svg>
