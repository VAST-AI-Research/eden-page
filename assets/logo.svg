<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Eden">
  <!-- Eden 标志。
       读法：圆环 = 园（伊甸是被围起来的园子，hortus conclusus），
       右上缺掉的 1/4 = 园子的出口；圆心的实心点 = 种子 / 生成的起点；
       从圆心射向缺口的箭头 = 从一粒里长出去、越出园墙。
       也正好是团队在做的事：一个模型（点）生成出外面的世界（箭头指向园外）。

       几何（改动前先重算，别手调）：
         环心 (29.5,34.5)、半径 23，缺口 90 度、正对右上（-45 度方向）。
         弧从 (52.5,34.5) 即 0 度 顺时针走 270 度到 (29.5,11.5) 即 -90 度，
         所以 large-arc=1 sweep=1 —— sweep 写 0 会把环画到缺口那一侧去。
         箭头沿 -45 度从圆心射出到距心 39.5，箭尖两笔构成一个直角。
         环心刻意不在 (32,32)：箭头往右上伸出会把外接盒带偏，这个位置是按
         渲染出的实际 alpha 边界反推的，图形正好占满 2..62（60x60，四周留 2）。

       没有背景板：图形本身是品牌紫线条，底色透出页面自己的，
       所以浅色深色两种主题都能直接用（比之前带紫底方块的版本干净）。
       约定：纯色、无渐变（见 CLAUDE.md 的样式基调）。品牌色写死在文件里，
       换主题时记得连 favicon.svg 一起改。
       注意：SVG 是 XML，注释里不能出现连续两个减号，写 CSS 变量名会让整个文件解析失败。 -->
  <g fill="none" stroke="#5b4bdb" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- 园墙：缺右上 1/4 -->
    <path d="M52.5 34.5 A 23 23 0 1 1 29.5 11.5"/>
    <!-- 从圆心射向缺口的箭头 -->
    <path d="M29.5 34.5 L 57.43 6.57"/>
    <path d="M45.93 6.57 H 57.43 V 18.07"/>
  </g>
  <!-- 种子：圆心的实心点。最后画，盖住箭头杆的起点。 -->
  <circle cx="29.5" cy="34.5" r="7" fill="#5b4bdb"/>
</svg>
