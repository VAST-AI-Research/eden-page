<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- 下面这些 meta 的内容会被 js/app.js 按当前页面动态改写；
     这里的值是没有 JS 时的兜底 / 爬虫首屏看到的默认值。 -->
<title>Eden</title>
<meta name="description" content="Eden — generative models for interaction and simulation.">
<meta name="keywords" content="generative model, game, simulation, video generation, scene">
<meta name="author" content="Eden">
<link rel="canonical" href="">

<meta property="og:type" content="website">
<meta property="og:title" content="Eden">
<meta property="og:description" content="Eden — generative models for interaction and simulation.">
<meta property="og:image" content="https://vast-eden.ai/assets/stereo-world/images/teaser.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/vast-icon-black.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/vast-icon-black.png">

<!-- 字体自托管：Instrument Sans（英文/数字）+ OPPO Sans（中文回退）。
     不引 Google Fonts。 -->
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/vast.css">
</head>

<body>
<!-- 下面这些静态文案由 js/app.js 的 initLang() 按当前语言改写，
     这里填的是无 JS 时的兜底值。 -->
<a class="skip-link" id="skip-link" href="#main">Skip to content</a>
<div class="progress" id="progress" aria-hidden="true"></div>

<!-- ==============================================================  header
     铺满整宽。左：team name。中：Project / Research / Blog 主导航。
     右：项目切换器（只在项目详情页出现）+ 主题切换。 -->
<header class="site-header" id="site-header">
  <div class="header-inner">
    <a class="brand" id="brand-link" href="?">
      <img class="brand__logo" id="brand-logo" src="assets/eden-logo-black.svg" alt="VAST Eden">
      <span class="brand__name">
        <span class="full" id="brand-full">Eden</span>
        <span class="short" id="brand-short">Eden</span>
      </span>
    </a>

    <nav class="header-nav" id="header-nav" aria-label="Main navigation"></nav>

    <span class="header-spacer"></span>

    <!-- 项目切换器：列表页会被 JS 隐藏 -->
    <div class="switcher" id="switcher" hidden>
      <button class="switcher__btn" id="switcher-btn" type="button"
              aria-haspopup="listbox" aria-expanded="false" aria-controls="switcher-menu">
        <span class="label" id="switcher-label">Projects</span>
        <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </button>
      <div class="switcher__menu" id="switcher-menu" role="listbox"
           aria-label="Select a project" data-open="false"></div>
    </div>

    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle color theme"></button>
  </div>
</header>

<!-- ================================================================ main -->
<main id="main">
  <!-- hero 由 js 渲染：列表页是栏目标题，详情页是论文标题/作者/链接/teaser -->
  <div class="hero" id="hero">
    <div class="wrap">
      <p id="hero-placeholder" style="padding:5rem 0;color:var(--text-muted)">Loading…</p>
    </div>
  </div>

  <!-- 章节内导航，吸附在 header 下面（只有详情页会填充） -->
  <nav class="toc" id="toc" aria-label="On this page" hidden></nav>

  <!-- 列表页的卡片 / 详情页的各 section 都插到这里 -->
  <div id="sections"></div>
</main>

<!-- ============================================================== footer -->
<footer class="site-footer">
  <div class="wrap footer-grid">
    <div>
      <strong id="footer-team" style="color:var(--text);font-size:1rem"></strong>
      <p id="footer-note" style="margin-top:.4rem;max-width:46ch"></p>
    </div>
    <nav class="footer-links" id="footer-links" aria-label="Footer links"></nav>
  </div>
  <div class="wrap">
    <p class="credit" id="footer-credit"></p>
  </div>
</footer>

<!-- ============================================================ lightbox -->
<div class="lightbox" id="lightbox" data-open="false" role="dialog" aria-modal="true" aria-label="Zoomed preview">
  <button class="lightbox__close" id="lightbox-close" type="button" aria-label="Close preview">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div class="lightbox__inner">
    <div id="lightbox-stage"></div>
    <p class="lightbox__caption" id="lightbox-caption"></p>
  </div>
</div>

<!-- 内容数据。改内容只动这个文件。 -->
<script src="data/projects.js"></script>
<script src="js/app.js"></script>
<!-- Cloudflare Web Analytics -->
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "28cfdeb4a7cb4275925fe1ea8132b1d4"}'></script>
<!-- End Cloudflare Web Analytics -->
</body>
</html>
